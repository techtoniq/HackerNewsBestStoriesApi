# Keeps the pinned versions current: NuGet packages (with their lock files), the digest-pinned
# base images in the Dockerfile, and the GitHub Actions used by CI.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      dotnet:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
