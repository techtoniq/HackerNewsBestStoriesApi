name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: |
          set -o pipefail
          dotnet restore BestStories.slnx --locked-mode 2>&1 | tee -a ci.log

      - name: Build
        run: |
          set -o pipefail
          dotnet build BestStories.slnx --configuration Release --no-restore 2>&1 | tee -a ci.log

      # Component tests start a real Redis container through Testcontainers,
      # using the Docker engine that GitHub-hosted Ubuntu runners provide.
      - name: Test
        run: |
          set -o pipefail
          dotnet test --solution BestStories.slnx --configuration Release --no-build 2>&1 | tee -a ci.log

      # Surface the first errors as annotations so they are visible on the pull request
      # without opening the raw log.
      - name: Report errors
        if: failure()
        run: |
          sed -E 's/\x1B\[[0-9;]*[A-Za-z]//g' ci.log > ci.plain.log
          {
            grep -E "error [A-Z]+[0-9]+" ci.plain.log | sed -E 's/^.*(error [A-Z]+[0-9]+)/\1/' | sort -u
            grep -E -A8 "^\s*failed " ci.plain.log
          } | grep -v -E "^\s*$|^--$" \
            | head -n 45 \
            | while IFS= read -r line; do echo "::error::${line}"; done

  container-image:
    name: Container image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Build image
        run: |
          set -o pipefail
          docker build --progress=plain --tag beststories-api:ci . 2>&1 | tee docker.log

      - name: Report errors
        if: failure()
        run: |
          grep -E "error [A-Z]+[0-9]+|ERROR" docker.log \
            | sed -E 's/^.*(error [A-Z]+[0-9]+)/\1/' \
            | sort -u \
            | head -n 40 \
            | while IFS= read -r line; do echo "::error::${line}"; done
